<div class="photos-page">


  <header class="photos-header">

    <div class="photos-title">
      <button
        class="back-button"
        type="button"
        routerLink="/"
      >
        <i class="pi pi-arrow-left"></i>
        <span>Slideshow</span>
      </button>

      <div>
        <h1>Photos</h1>
        <span class="photo-count">{{ photoViews.length }} photos</span>
      </div>
    </div>

    <div class="photos-actions">
      <button
        class="action-button secondary"
        type="button"
      >
        <i class="pi pi-cloud"></i>
        <span>Sources</span>
      </button>

      <button
        class="action-button secondary"
        type="button"
        (click)="photoInput.click()"
      >
        <i class="pi pi-images"></i>
        <span>Add photos</span>
      </button>

      <button
        class="action-button primary"
        type="button"
      >
        <i class="pi pi-folder"></i>
        <span>Add folder</span>
      </button>
      <button
        class="action-button danger"
        type="button"
        (click)="deleteAllPhotos()"
      >
        <i class="pi pi-ban"></i>
        <span>Clear all</span>
      </button>
    </div>

  </header>

  <main class="photos-grid">
    @for (photo of photoViews; track photo.url){

    <div
      class="photo-thumbnail" >
      <img
        [src]="photo.url"
        [alt]="photo.url"
        loading="lazy"
      />
    </div>
    }
  </main>

</div>

<input
  #photoInput
  type="file"
  accept="image/*"
  multiple
  hidden
  (change)="onPhotosSelected($event)"
/>
