<div class="slideshow">

    <img
        class="photo"
        [class.fade]="transitioning"
        [src]="currentPhoto.path">

    <app-clock class="clock"></app-clock>

    <app-map
        class="map"
        [photo]="currentPhoto">
    </app-map>

    <div class="metadata">

        <div>{{currentPhoto.location}}</div>

        <div>{{currentPhoto.takenAt | date}}</div>

    </div>

</div>
