<div class="slideshow">

    <img
        class="photo"
        [src]="currentPhoto?.url">

    <app-clock class="clock"></app-clock>

    <app-map
        class="map"
        [photo]="currentPhoto">
    </app-map>

    <div class="metadata">

        <div>{{currentPhoto?.location}}</div>

        <div>{{currentPhoto?.takenAt | date}}</div>

    </div>

</div>
